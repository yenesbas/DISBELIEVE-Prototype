<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Disbelieve Prototype</title>
    <style>
        body {
            margin: 0;
            padding: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
            background-color: #1a1a1a;
            font-family: Arial, sans-serif;
            color: white;
        }
        #gameContainer {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            max-width: 100%;
        }
        /* The element that goes fullscreen: it holds nothing but the canvas,
           so the text around the game stays behind in the page. */
        #gameStage {
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 0;
            border: 2px solid #444;
        }
        canvas {
            display: block;
            background-color: #2a2a2a;
        }
        /* Fullscreen: black bars around the game's 5:3 shape, no border.
           The prefixed rules are duplicated on purpose - one selector list
           with both would be thrown away by browsers that know only one. */
        #gameStage:fullscreen {
            width: 100vw;
            height: 100vh;
            background-color: #000;
            border: none;
        }
        #gameStage:-webkit-full-screen {
            width: 100vw;
            height: 100vh;
            background-color: #000;
            border: none;
        }
        body.fullscreen #instructions,
        body.fullscreen #stats {
            display: none;
        }
        #instructions {
            text-align: center;
            color: #aaa;
            font-size: 14px;
            line-height: 1.5;
        }
        #instructions p {
            margin: 0;
        }
        #instructions .flavour {
            font-size: 13px;
            color: #7a7a86;
        }
        #instructions .warn { color: #ff4444; }
        #instructions .deceive { color: #8c44ff; }
        #instructions .door { color: #44aa66; }
        /* One line, so the game keeps the height */
        #stats {
            display: flex;
            gap: 20px;
            align-items: baseline;
            font-size: 15px;
        }
        #levelName { color: #aaa; }
        #deathCount { color: #ff4444; }

        /* On-screen controls (src/touch.js): only on touch screens */
        #touchControls { display: none; }
        body.touch #touchControls { display: block; }
        body.touch #instructions { display: none; }
        body.touch { padding: 0; }
        body.touch canvas { touch-action: none; }
        body.touch, body.touch * {
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
        }
        .touchButton {
            position: fixed;
            z-index: 10;
            width: 72px;
            height: 72px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.35);
            background: rgba(255, 255, 255, 0.12);
            color: rgba(255, 255, 255, 0.8);
            font: bold 26px Arial, sans-serif;
            padding: 0;
            touch-action: none;
        }
        .touchButton.down { background: rgba(255, 255, 255, 0.35); }
        #touchLeft    { left:  calc(16px + env(safe-area-inset-left, 0px));  bottom: calc(16px + env(safe-area-inset-bottom, 0px)); }
        #touchRight   { left:  calc(104px + env(safe-area-inset-left, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); }
        #touchJump    { right: calc(16px + env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); width: 88px; height: 88px; }
        #touchRestart, #touchBack { width: 48px; height: 48px; font-size: 18px; top: calc(12px + env(safe-area-inset-top, 0px)); }
        #touchBack    { left:  calc(12px + env(safe-area-inset-left, 0px)); }
        #touchRestart { right: calc(12px + env(safe-area-inset-right, 0px)); }
    </style>
</head>
<body>
    <div id="gameContainer">
        <div id="instructions">
            <p><strong>← / →</strong> or <strong>A / D</strong> Move | <strong>Space</strong> or <strong>W</strong> Jump | <strong>R</strong> Restart | <strong>F</strong> Fullscreen | <strong>ESC</strong> Menu</p>
            <p class="flavour">⚠️ <span class="warn">DISBELIEVE</span> <span class="deceive">what you see</span> &middot; <span class="door">reach the green door</span> &middot; click once to enable audio</p>
        </div>
        <div id="gameStage">
            <!-- The game sizes this canvas itself; 1200x720 is its coordinate space -->
            <canvas id="gameCanvas" width="1200" height="720"></canvas>
        </div>
        <div id="stats">
            <div id="levelName">Select a level to begin</div>
            <div id="deathCount">Deaths: 0</div>
        </div>
    </div>
    <!-- Load individual chapter files -->
    <script src="src/levels/chapter_1.js"></script>
    <script src="src/levels/chapter_2.js"></script>
    <script src="src/levels/chapter_3.js"></script>
    
    <!-- Combine chapters into main array -->
    <script src="src/levels.js"></script>
    
    <!-- Main game logic -->
    <script src="src/game.js"></script>

    <!-- Level editor: saving system, editor, and the "My Levels" screen -->
    <script src="src/editor/level_storage.js"></script>
    <script src="src/editor/editor.js"></script>
    <script src="src/editor/custom_levels.js"></script>

    <!-- On-screen controls for phones and tablets -->
    <script src="src/touch.js"></script>
</body>
</html>
